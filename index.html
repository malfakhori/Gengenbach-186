<html lang="en">

    <title>three.js r180 - AR Hit Test</title>

          content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta property="og:title" content="three.js r180 - AR hit test">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #info {
            position: absolute;
            top: 10px;

            text-align: center;

        }

        #info a {
            color: #fff;

        }

        #status {
            position: absolute;
            top: 50px;

            z-index: 2;

    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">
            three.js
        </a>
        r180 - AR Hit Test
    </div>

    <div id="status">Initializing WebXR...</div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let camera;
        let scene;
        let renderer;
        let reticle;

        let hitTestSource = null;
        let hitTestSourceRequested = false;

        const statusElement = document.getElementById('status');

        function setStatus(message) {
            statusElement.textContent = message;
            console.log('[AR Hit Test]', message);
        }

        init();

        function init() {
            console.log('Three.js revision:', THREE.REVISION);
            setStatus('Three.js revision: ' + THREE.REVISION);

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(
                70,
                window.innerWidth / window.innerHeight,
                0.01,
                20
            );

            const light = new THREE.HemisphereLight(
                0xffffff,
                0xbbbbff,
                3
            );

            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });

            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;

            document.body.appendChild(renderer.domElement);

            const arButton = ARButton.createButton(renderer, {
                requiredFeatures: ['hit-test']
            });

            document.body.appendChild(arButton);

            const geometry = new THREE.CylinderGeometry(
                0.1, 0.1, 0.2, 32
            ).translate(0, 0.1, 0);

            function onSelect() {
                if (!reticle.visible) {
                    setStatus('Select ignored: no surface detected.');
                    return;
                }

                const material = new THREE.MeshPhongMaterial({
                    color: Math.random() * 0xffffff
                });

                const mesh = new THREE.Mesh(geometry, material);

                reticle.matrix.decompose(
                    mesh.position,
                    mesh.quaternion,
                    mesh.scale
                );

                mesh.scale.y = Math.random() * 2 + 1;

                scene.add(mesh);
                setStatus('Object placed successfully.');
            }

            const controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32)
                    .rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({
                    color: 0xffffff
                })
            );

            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize);

            renderer.setAnimationLoop(animate);

            setStatus('Ready. Start AR and scan a surface.');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }

        function animate(timestamp, frame) {
            if (frame) {
                const session = renderer.xr.getSession();
                const referenceSpace = renderer.xr.getReferenceSpace();

                if (!session || !referenceSpace) {
                    renderer.render(scene, camera);
                    return;
                }

                if (!hitTestSourceRequested) {
                    setStatus('AR session active. Requesting hit-test source...');

                    session.requestReferenceSpace('viewer')
                        .then((viewerSpace) => {
                            return session.requestHitTestSource({
                                space: viewerSpace
                            });
                        })
                        .then((source) => {
                            hitTestSource = source;
                            setStatus('Hit-test source ready. Scan a surface.');
                        })
                        .catch((error) => {
                            console.error('Hit-test source error:', error);
                            setStatus(
                                'Hit-test source failed: ' + error.message
                            );
                        });

                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                        reticle.visible = false;
                        setStatus('AR session ended.');
                    }, { once: true });

                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const results = frame.getHitTestResults(hitTestSource);

                    if (results.length > 0) {
                        const hit = results[0];
                        const pose = hit.getPose(referenceSpace);

                        if (pose) {
                            reticle.visible = true;

                            reticle.matrix.fromArray(
                                pose.transform.matrix
                            );

                            setStatus(
                                'Surface detected. Tap to place an object.'
                            );
                        }
                    } else {
                        reticle.visible = false;
                        setStatus(
                            'Hit-test source active; no surface detected yet.'
                        );
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
